data:
  binance_spot:
    base_url: https://data.binance.vision/data/spot
    interval: 1m
    monthly_start: "2025-09"
    monthly_end: "2026-08"
    daily_start: "2026-09-01"
    daily_end: latest            # or an explicit YYYY-MM-DD
    raw_dir: data/binance_spot/klines_1m
    parquet_dir: data/binance_spot/parquet
    manifest: data/binance_spot/_manifest.jsonl
    lock_file: data/binance_spot/.downloader.lock
    max_workers: 4               # hard-capped at 4 in code

