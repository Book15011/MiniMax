data:
  base_url: https://data.binance.vision/data
  lock_file: data/.downloader.lock   # one lock for every download job
  max_workers: 8                     # hard-capped at 8 in code
  # Each group: monthly [start, end|latest] and/or daily_from (daily files up to the newest published day).
  jobs:
    spot_klines_1m:
      market: spot
      dataset: klines
      interval: 1m
      raw_dir: data/binance_spot/klines_1m
      parquet_dir: data/binance_spot/parquet
      manifest: data/binance_spot/_manifest.jsonl
      groups:
        - symbols: universe
          monthly: ["2025-09", "2026-08"]
          daily_from: "2026-09-01"
    spot_klines_1h:
      market: spot
      dataset: klines
      interval: 1h
      raw_dir: data/binance_spot/klines_1h
      manifest: data/binance_spot/_manifest_1h.jsonl
      groups:
        - symbols: [BTCUSDT, ETHUSDT]
          monthly: ["2018-01", "2025-08"]
        - symbols: universe
          exclude: [BTCUSDT, ETHUSDT]
          monthly: ["2020-01", "2025-08"]
        # One overlap month, only to assert that 1m->1h resampling matches the 1h archive.
        - symbols: [BTCUSDT]
          monthly: ["2026-08", "2026-08"]
        # Historically large coins (incl. delisted) to limit survivorship bias, plus renamed tickers.
        - symbols: [LUNAUSDT, FTTUSDT, BCHUSDT, ETCUSDT, EOSUSDT, ATOMUSDT, XMRUSDT, ALGOUSDT, VETUSDT,
                    THETAUSDT, AXSUSDT, SANDUSDT, MANAUSDT, GALAUSDT, APEUSDT, OPUSDT, INJUSDT, RUNEUSDT,
                    EGLDUSDT, XTZUSDT, MKRUSDT, GRTUSDT, CHZUSDT, KSMUSDT, SUSHIUSDT, COMPUSDT, SNXUSDT,
                    NEOUSDT, MATICUSDT, FTMUSDT]
          monthly: ["2020-01", "2026-08"]
          daily_from: "2026-09-01"
    # Months before these starts come from the lob-execution-hma copy (src/data/external_copy.py).
    futures_funding:
      market: futures/um
      dataset: fundingRate
      raw_dir: data/external/binance_futures/fundingRate
      manifest: data/external/binance_futures/_manifest_fundingRate.jsonl
      groups:
        - symbols: [BTCUSDT]
          monthly: ["2026-08", latest]
    futures_metrics:
      market: futures/um
      dataset: metrics
      raw_dir: data/external/binance_futures/metrics
      manifest: data/external/binance_futures/_manifest_metrics.jsonl
      groups:
        - symbols: [BTCUSDT]
          daily_from: "2026-08-12"
  external_copy:
    source: /home/ubuntu/test/lob-execution-hma/data/raw_l1   # READ-ONLY source
    dest: data/external/lob_copy
    datasets: [funding_rate, open_interest]
  fred:
    url: https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}
    dir: data/external/fred
    series: [CPIAUCNS, DFEDTARU, DGS10, DTWEXBGS, SP500, VIXCLS, DCOILWTICO]

# Lookalike validation set (src/validation). Every value here is recorded in validation/validation_set_v1.json.
validation:
  live_start: "2026-10-03 16:00"     # T*, UTC (= 2026-10-04 00:00 HKT)
  holdout_days: 56                   # H = T* - 56d
  horizon_days: 14
  pool_earliest: "2020-06-01"
  grid_hour_utc: 16
  k: 25
  min_separation_days: 14
  span_days: 90
  max_per_span: 3
  hourly_from_1m: "2025-09-01"       # symbols with 1m data use resampled 1m from here on
  overlap_check: {symbol: BTCUSDT, month: "2026-08"}
  segment_gap_days: 7                # a longer hole starts a new listing (e.g. LUNA 2022, FTT 2022-23)
  renames:
    - {old: MATICUSDT, new: POLUSDT}
    - {old: FTMUSDT, new: SUSDT}
  rename_checks: {min_overlap_hours: 24, max_median_abs_log_diff: 0.005, max_abs_log_diff: 0.02,
                  max_gap_hours: 168, max_gap_abs_log_diff: 0.05}
  universe:
    top_n: 30
    min_history_days: 90
    volume_days: 30
    exclude: [PAXGUSDT]
    stablecoins: [USDCUSDT, FDUSDUSDT, TUSDUSDT, BUSDUSDT, DAIUSDT, USDPUSDT, PYUSDUSDT, USD1USDT,
                  EURUSDT, AEURUSDT, USDEUSDT, USTUSDT]
    leveraged_regex: "^[A-Z0-9]+(UP|DOWN|BULL|BEAR)USDT$"
  funding_min_coverage: 0.5          # P1 needs >= 50% of the expected prints in the last 7 days
  funding_prints_per_day: 3          # BTCUSDT perp funds every 8h
  oi_max_staleness_hours: 1
  cpi_release_day: 16                # month m assumed released on the 16th of m+1, 00:00 UTC
  macro_lag_days: {DTWEXBGS: 7}      # H.10 is published weekly: use values at least 7 days old
  walkforward:
    start: "2022-07-01"
    step_days: 7
    screen_end: "2024-06-30"
    confirm_start: "2024-07-01"
    random_draws: 50
    bootstrap_reps: 2000
    bootstrap_block: 4
    seed: 20261003
  sensitivity_k: [15, 40]

risk: {}   # TBD

# Exchange client and order planning (src/api, src/execution, src/live).
execution:
  env_file: .env                # holds ROOSTOO_API_KEY, ROOSTOO_SECRET_KEY, ROOSTOO_ENV (test here; competition only on EC2)
  calls_per_minute: 20          # our ceiling; the documented limit is 30 calls/min including queries
  timeout_s: 10
  fee: 0.001                    # 0.1% market orders and shorts; 0.05% limit (maker) fills
  cash_buffer: 0.01             # keep 1% of equity in USD so buys never fail on rounding
  min_trade_usd: 10             # skip orders smaller than this (dust)

# Live bot (src/live/runner.py, deploy/README.md). Paper trading on the research server; live only on EC2.
live:
  model: team_rot_ew            # PENDING the team's launch decision (TEAM_PLAN 4.3; reports/review/20261001-scoring-review.md)
  mode: paper                   # paper | live
  start_at: "2026-10-04 12:00"  # UTC = Oct 4 20:00 HKT, the round's start (Roostoo competition 538). Live mode: earlier bars recorded, never traded
  clock_warn_s: 2               # warn when the machine clock is this far off Roostoo's (the bot runs on Roostoo's time anyway)
  clock_error_s: 30             # error above this; Roostoo rejects signatures more than 60 s off
  state_dir: data/live          # hourly store, state.json and JSONL logs (gitignored)
  history_days: 300             # hourly bars kept: >= the longest lookback (team_trend_2's state needs 240 days)
  process_after_s: 45           # read bar HH:00 this long after the hour
  max_fill_hours: 48            # carry a price forward over at most this many unfilled hours in the model's view
  endgame:                      # end-of-round lock-in (reports/review/20261002-new-rules.md). OFF: enabling it is a team decision
    enabled: false
    from_day: 10                # days after the round's first hour
    lock_return: 0.03           # once equity is this far above the round's starting equity: sell everything, hold cash to the end
  order_spacing_s: 3            # pause between orders. Organizers: no cap on trades per minute, only 30 API calls/min (we use <= 20)
  paper_equity: 100000
  binance_rest: https://api.binance.com/api/v3/klines   # blocked on the research server; then the archive
  use_archive: true             # data.base_url daily 1h klines, published the next day

# Backtest harness (backtest/). Every model is scored the same way; docs/STRATEGY_GUIDE.md explains each field.
harness:
  panel_dir: data/validation              # hourly panel + point-in-time universe written by src.validation.build
  cache_dir: data/harness                 # cached window results per model (gitignored with data/)
  reports_dir: reports
  universe: roostoo                       # roostoo = only coins Roostoo lists (live-realistic); broad = every liquid series
  grid_hour_utc: 16                       # windows start and daily decisions happen at 00:00 HKT
  window_days: 14
  first_window: "2020-06-01"
  periods:                                # by window start date (inclusive); matches the validation split
    SCREEN: ["2022-07-01", "2024-06-30"]
    CONFIRM: ["2024-07-01", "2026-07-25"]
  holdout_from: "2026-08-08 16:00"        # windows ending after this stay sealed until the launch model is frozen
  execution_lag_hours: 1                  # a decision at bar t trades at the close of bar t + 1
  fees: {taker: 0.001, short: 0.001}      # per side; shorts pay 0.1% to open and to close
  spreads_snapshot_glob: data/roostoo_snapshots/ticker_*.json
  default_half_spread_bps: 5              # coins missing from the snapshot (e.g. delisted ones)
  activity_guard_offset_hours: 11         # PROPOSED (was 20): if a day has no trade by then, the guard trades at the
                                          # 04:00 UTC bar (12:00 HKT), mid-day whether days count in UTC or HKT;
                                          # live, an unconfirmed fill is retried every later hour of the same day
  guard_utc_day: true                     # PROPOSED: the guard also fires when the day has no trade since 00:00 UTC,
                                          # so every day counts whether the organizers use UTC or HKT days
  keep_alive_weight: 0.002              # guard on a day already on target (all cash, one coin): trade 0.2% of equity, reversed next day
  min_active_days: 10
  scenario_sets:
    lookalikes: validation/validation_set_v1.json
    recent_n: 25

# Competition-style scoring (backtest/scoring/, docs/EVALUATION.md). Every value below is listed in the
# TEAM SIGN-OFF CHECKLIST of docs/EVALUATION.md and stays "pending team review" until the team confirms it.
scoring:
  version: 2                              # bump on any formula change; caches and the leaderboard key on it
                                          # v2 (2026-10-02): return first, reports/review/20261002-prereg-return-first.md
  e0: 100000                              # USD equity at the start of every window, before the first trade
  hours_per_day: 24
  stride_days: 1                          # 1 = every pool window; a full run takes minutes, so no stride is needed
  window_hour_utc: 12                     # windows start every day at 12:00 UTC, as the round (2026-10-04 12:00 UTC)
  include_spent_holdout: true             # the holdout (windows ending after harness.holdout_from) was opened once on
                                          # 2026-10-01 and is spent; every headline is also reported without it
  live_like: validation/live_like_v2_prelim.json      # PART 0's method on 12:00 UTC starts (src.validation.prelim_v2)
  validation_set: validation/validation_set_v2_prelim.json   # LOOKALIKE-25, RECENT-25 and the 20 STRESS windows
  regimes: results/book/20261002-return-first/validation_v2_prelim/outcomes.parquet   # ex-post 3x3 grid (G3, report-only)
  recency_half_life_days: 60              # REC = 0.5 ** (age / 60 days), age = days from the start to the latest start
  headline: {live_like: 0.70, recency: 0.30}   # w = 0.7 LL / sum LL + 0.3 REC / sum REC, then the direction rebalance
  bars:                                   # on R_liq; a window is UP if BTC's close at its end >= at its start
    LENIENT:
      down: -0.014965215                  # the previous edition's #20 cut: mean of -1.4186090% (HK) and -1.5744340% (SG)
      up: 0.0                             # ASSUMPTION: no data on the general field in rising markets
    MIDDLE: 0.0
    STRICT: {stat: median, floor: 0.0}    # max(0, median R_liq of the 6 gate benchmarks): the previous median gate
  risk:
    primary: {variant: V1, convention: FLOORED, days: HKT}   # CS_HIT: mean composite over windows clearing LENIENT
  tie: {reps: 2000, seed: 20261002, level: 0.90, block: calendar_month, cs_tolerance: 0.05}
  reference_models: [team_cash, team_btc_hold, team_ew_daily, team_rot_ew, team_rot_iv, team_trend_2, team_mom_ss25]
  previous_tool_version: 56cb5a2e85d45862 # the leaderboard's "old REL" column (report only)
  replay:                                 # report only: the previous edition's real windows, ranked among its teams
    leaderboard_csv: results/pol/20261001-final/past_leaderboards_numeric.csv   # final returns, numbers only
    windows:
      - {name: "Round 1 (Mar 21-31)", start: "2026-03-21 12:00", hours: 240, competitions: [455, 456]}
      - {name: "Final (Apr 4-14)", start: "2026-04-04 12:00", hours: 240, competitions: [469]}
  rel: {bar_stat: max, bar_floor: 0.0, convention: FLOORED, robust_min: 1.0}   # report-only: the v1 primary
  liquidation_cost: 0.001                 # R_liq charges this on the gross notional still open at the end
  composite: {sortino: 0.4, sharpe: 0.3, calmar: 0.3}
  variants:                               # Sharpe, Sortino = (m / denominator) * sqrt(annualize)
    V1: {returns: daily, annualize: 1, calmar: mean}      # daily_raw (PRIMARY): Calmar = m / MDD
    V2: {returns: daily, annualize: 365, calmar: mean}    # daily_annual: Calmar = m * 365 / MDD
    V3: {returns: hourly, annualize: 8760, calmar: mean}  # hourly_annual: Calmar = m * 8760 / MDD
    V4: {returns: daily, annualize: 1, calmar: total}     # total_calmar: Calmar = R / MDD
  conventions:                            # denominator floors; 0 = no floor, and a zero denominator gives 0
    FLOORED: {s_daily: 0.001, dd_daily: 0.001, mdd: 0.002,
              s_hourly: 0.000204124145231931, dd_hourly: 0.000204124145231931}   # hourly = 0.001 / sqrt(24)
    POL: {s_daily: 0, dd_daily: 0, s_hourly: 0, dd_hourly: 0, mdd: 0.0001}       # as backtest/metrics.py
  primary: {variant: HEADLINE_RET}        # mean of HIT LENIENT, MIDDLE and STRICT (backtest/scoring/returnfirst.py)
  field: [team_btc_hold, team_ew_daily, team_rot_ew, team_rot_iv, team_trend_2, team_mom_ss25]   # the 6 gate benchmarks
  btc_hold: team_btc_hold                 # reference for G2 and G6
  gates:
    hard: [G1, G4, G5]                    # eligibility; G2, G3, G6_median and G6_worst are report-only
    G1: {min_active_days: 10, share_of_windows: 1.0, guard_flag_share: 0.25}   # HKT days (15 buckets for 12:00 starts)
    G3: {min_cell_median_return: -0.10}
    G5: {decisions: 30, seed: 20261003, noise_sigma: 0.01}
  compare: {block_windows: 56, reps: 2000, level: 0.90, seed: 20261003}   # 56: regimes outlast 14-window blocks (EVALUATION.md 7)
  report: {curves: 25}
  cache_dir: results/scoring/cache        # shared by every worktree (results/ links to the root's results/)
  registry: results/scoring/registry.jsonl     # append-only, one line per full run, written under a lock
  leaderboard: results/scoring/leaderboard.md  # regenerated after every registered run

# Model parameters: one block per model, under its author's marker (keeps merges clean).
models:
  # --- team (frozen benchmarks for the scoring field; docs/EVALUATION.md section 3) ---
  team_rot_ew: &team_rot_ew
    lookback_days: [3, 7, 14]
    vol_days: 30                  # covariance window of the book-volatility estimate
    min_history_days: 30
    k: 6
    keep_rank: 12
    weighting: equal
    target_daily_vol: 0.03
  team_rot_iv: &team_rot_iv
    lookback_days: [3, 7, 14]
    vol_days: 30
    min_history_days: 30
    k: 6
    keep_rank: 12
    weighting: inverse_vol
    target_daily_vol: 0.02
  team_trend_2: &team_trend_2
    coins: [BTCUSDT, ETHUSDT]
    ema_days: 40
    hysteresis: 0.03              # in trend above EMA * 1.03, out below EMA * 0.97, unchanged between
    state_days: 120               # the hysteresis is replayed over this many days at each decision
    vol_days: 30
    risk_budget: 0.25             # weight = 0.25 / annualized volatility
    out_of_trend_scale: 0.15
  team_mom_ss25:                  # the TEAM_PLAN v1 MOM-SS numbers, frozen (pol_mom_ss may evolve)
    lookback_days: [3, 7, 14]
    vol_days: 30
    min_history_days: 30
    min_coins: 8
    top_n: 15
    k: 5
    keep_rank: 10
    long_gross: 0.75
    long_vol_cap: 0.5
    short_gross: 0.25
    short_k: 4
  # --- pol ---
  pol_mom_ss: &pol_mom_ss
    lookback_days: [3, 7, 14]
    vol_days: 30
    min_history_days: 30
    min_coins: 8
    top_n: 15
    k: 5
    keep_rank: 10
    long_gross: 0.75
    long_vol_cap: 0.5          # annualized; upper bound that assumes the coins are perfectly correlated
    short_gross: 0.25
    short_k: 4
  pol_trend_ls: &pol_trend_ls
    lookback_days: 21
    threshold: 0.5
    vol_days: 30
    min_history_days: 30
    min_coins: 8
    top_n: 15
    target_vol: 0.35
  # combinations (src/models/pol/_combo.py): sleeve parameters are anchors to the sleeves' own blocks
  pol_combo_rt:
    replay_steps: 1
    sleeves:
      team_rot_ew: {weight: 0.5, params: *team_rot_ew}
      pol_trend_ls: {weight: 0.5, params: *pol_trend_ls}
  pol_combo_rb:
    replay_steps: 1
    sleeves:
      team_btc_hold: {weight: 0.5}
      team_rot_ew: {weight: 0.5, params: *team_rot_ew}
  pol_combo_rtt:
    replay_steps: 1
    sleeves:
      team_rot_ew: {weight: 0.3333333333333333, params: *team_rot_ew}
      pol_trend_ls: {weight: 0.3333333333333333, params: *pol_trend_ls}
      team_trend_2: {weight: 0.3333333333333333, params: *team_trend_2}
  pol_combo_ms_tl:
    replay_steps: 1
    sleeves:
      pol_mom_ss: {weight: 0.5, params: *pol_mom_ss}
      pol_trend_ls: {weight: 0.5, params: *pol_trend_ls}
  pol_combo_all:
    replay_steps: 1
    sleeves:
      team_btc_hold: {weight: 0.14285714285714285}
      team_ew_daily: {weight: 0.14285714285714285}
      team_rot_ew: {weight: 0.14285714285714285, params: *team_rot_ew}
      team_rot_iv: {weight: 0.14285714285714285, params: *team_rot_iv}
      team_trend_2: {weight: 0.14285714285714285, params: *team_trend_2}
      pol_mom_ss: {weight: 0.14285714285714285, params: *pol_mom_ss}
      pol_trend_ls: {weight: 0.14285714285714285, params: *pol_trend_ls}
  pol_switch_rt:                  # orchestrators: one method at a time, by BTC's trend state (team_trend_2's rule)
    replay_steps: 1
    switch: *team_trend_2
    sleeves:
      team_rot_ew: {when: up, params: *team_rot_ew}
      pol_trend_ls: {when: down, params: *pol_trend_ls}
  pol_switch_rc:
    replay_steps: 1
    switch: *team_trend_2
    sleeves:
      team_rot_ew: {when: up, params: *team_rot_ew}
  # --- book ---
  # --- baitoey ---
  baitoey_mr_bbrsi: &baitoey_mr_bbrsi   # research/baitoey/prereg/20261001-mean-reversion.md
    bar_hours: 24                 # indicator bars (the study sets them to the rebalance interval)
    bb_bars: 20                   # Bollinger: 20-bar mean ...
    bb_k: 2.0                     # ... minus 2 standard deviations
    rsi_bars: 14
    rsi_entry: 30                 # buy below the lower band with RSI < 30
    max_hold_hours: 72            # sell if no buy signal for this long (time stop)
    vol_days: 30
    min_history_days: 30
    k: 6                          # slots, each 1/k of the book
    target_daily_vol: 0.03
  baitoey_rot_dip:                # same note
    lookback_days: [3, 7, 14]     # as team_rot_ew
    vol_days: 30
    min_history_days: 30
    k: 6
    keep_rank: 12
    weighting: equal
    target_daily_vol: 0.03
    dip_filter: true              # new entries only when the 14-bar RSI is below dip_rsi
    bar_hours: 24
    rsi_bars: 14
    dip_rsi: 50
  baitoey_rot_max: &baitoey_rot_max   # research/baitoey/prereg/20261001-return-max-rotation.md
    lookback_days: [3, 7, 14]     # as team_rot_ew
    vol_days: 30
    min_history_days: 30
    k: 4
    keep_rank: 12
    weighting: equal
    target_daily_vol: .inf        # no volatility cap: always fully invested (gross 1.0)
    btc_gate: false               # D: all cash when BTC closed below its gate_days average gate_confirm_days in a row
    gate_days: 20
    gate_confirm_days: 2
  baitoey_breakout:               # variant A of research/baitoey/prereg/20261001-volume-timing.md
    breakout_hours: 72            # enter above the highest close of the previous 72 h ...
    entry_volume_ratio: 1.5       # ... while 24 h quote volume > 1.5 x a normal day of the last 7
    volume_short_hours: 24
    volume_long_days: 7
    exit_low_hours: 24            # exit below the lowest close of the previous 24 h ...
    trail_hours: 72               # ... or below the 72 h highest close minus atr_mult daily ATRs
    atr_days: 14
    atr_mult: 2.0
    lookback_days: [7, 14]        # ranks simultaneous breakouts (risk-adjusted momentum)
    vol_days: 30
    min_history_days: 30
    k: 6                          # slots, each 1/k of the book
    target_daily_vol: 0.03        # book scaled down to <= 3%/day estimated volatility
  baitoey_vt_mom: &baitoey_vt_mom   # variants B0, B and C of the same note
    lookback_days: [7, 14]
    vol_days: 30
    min_history_days: 30
    k: 6
    keep_rank: 12
    weighting: equal
    target_daily_vol: 0.03
    early_exit: true              # B: skip a coin for exit_cooldown_hours after a volume-confirmed 24 h low
    exit_low_hours: 24
    exit_volume_ratio: 1.5
    exit_cooldown_hours: 24
    volume_short_hours: 24
    volume_long_days: 7
    no_chase: false               # C: skip a coin after a volume spike until it pulls back
    chase_return_hours: 24
    chase_return: 0.15
    chase_volume_ratio: 3.0
    chase_window_hours: 72
    chase_pullback: 0.05
