# Source: the PUBLIC /v3/exchangeInfo snapshot of 2026-09-29 -- pairs with AssetType == crypto,
# minus TON/USD and OMNI/USD (no ticker data). The 21 AssetType == stock pairs are excluded.
# MUST be re-checked against the competition account's exchangeInfo once API keys arrive.
# All code reads the universe from here; do not hard-code pair lists elsewhere.
universe:
  - BTC/USD
  - ETH/USD
  - ZEC/USD
